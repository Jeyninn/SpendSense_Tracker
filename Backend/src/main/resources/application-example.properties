spring.application.name=expense-tracker

# ─────────────────────────────────────────────────────────────────────────────
# DATABASE CONFIGURATION
# Set the following environment variables in your deployment platform:
#   DB_URL      - Full JDBC URL, e.g. jdbc:mysql://<host>:3306/<database>
#   DB_USERNAME - Database user
#   DB_PASSWORD - Database password
# ─────────────────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/expense_tracker}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:CHANGE_ME}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server Port (Render, Railway, etc. assign dynamic PORT)
server.port=${PORT:8080}

# ─────────────────────────────────────────────────────────────────────────────
# JWT CONFIGURATION
# Set the following environment variable in your deployment platform:
#   JWT_SECRET - A Base64-encoded HMAC-SHA256 key of at least 256 bits
#                Generate one with: openssl rand -base64 32
# ─────────────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ─────────────────────────────────────────────────────────────────────────────
# SPENDSENSE AI SERVICE (Python/FastAPI)
# This is a SEPARATE service that runs on its own server/container.
# Set the following environment variable in your deployment platform:
#   SPENDSENSE_API_URL - URL of the deployed Python FastAPI service
#                        e.g. https://your-ml-service.onrender.com
# ─────────────────────────────────────────────────────────────────────────────
spendsense.api.url=${SPENDSENSE_API_URL:http://localhost:8001}

# ─────────────────────────────────────────────────────────────────────────────
# CORS CONFIGURATION
# Set the following environment variable in your deployment platform:
#   FRONTEND_URL - The deployed Angular frontend URL
#                  e.g. https://your-app.vercel.app
#                  Supports comma-separated values for multiple origins
# ─────────────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:4200}
